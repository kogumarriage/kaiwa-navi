<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>こぐま会話ナビ</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
:root{
--cream:#FDF8F2;
--warm-white:#FFFCF8;
--peach-light:#FDEEE6;
--peach:#F5C4A8;
--peach-mid:#E8A07A;
--peach-deep:#C96B3A;
--brown-dark:#4A2C14;
--sage:#8FAB96;
--sage-light:#DCE9DF;
--sage-dark:#4A7057;
--gold:#C9A84C;
--gold-light:#F5E9C8;
--brown-soft:#8B5E3C;
--text-main:#2D1E12;
--text-sub:#7A5A42;
--text-hint:#B8997F;
--border:#E8D5C0;
--shadow:rgba(90,50,20,0.08);
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:'Noto Sans JP',sans-serif;
background:var(--cream);
color:var(--text-main);
min-height:100vh;
}

header{
background:var(--warm-white);
border-bottom:1px solid var(--border);
padding:1.2rem 2rem;
display:flex;
align-items:center;
gap:1rem;
position:sticky;
top:0;
z-index:100;
box-shadow:0 2px 12px var(--shadow);
}

.logo-bear{
width:44px;
height:44px;
background:var(--peach-light);
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
border:2px solid var(--peach);
}

header h1{
font-family:'Noto Serif JP',serif;
font-size:1.3rem;
color:var(--brown-dark);
font-weight:600;
}

header p{
font-size:0.75rem;
color:var(--text-hint);
}

.local-banner{
background:#EAF4EA;
border-bottom:1px solid #A8D5A2;
padding:0.7rem 2rem;
display:flex;
align-items:center;
gap:0.75rem;
font-size:0.82rem;
color:#2D5A27;
}

main{
max-width:920px;
margin:2rem auto;
padding:0 1.5rem 4rem;
}

.section-intro{
text-align:center;
margin-bottom:2.5rem;
}

.section-intro h2{
font-family:'Noto Serif JP',serif;
font-size:1.6rem;
color:var(--brown-dark);
font-weight:600;
margin-bottom:0.5rem;
}

.section-intro p{
font-size:0.9rem;
color:var(--text-sub);
line-height:1.7;
}

.card{
background:var(--warm-white);
border:1px solid var(--border);
border-radius:16px;
padding:1.75rem 2rem;
margin-bottom:1.25rem;
box-shadow:0 2px 16px var(--shadow);
}

.card-title{
font-family:'Noto Serif JP',serif;
font-size:1.05rem;
color:var(--brown-dark);
font-weight:600;
margin-bottom:1.25rem;
display:flex;
align-items:center;
gap:0.5rem;
}

.card-title .icon{
width:28px;
height:28px;
background:var(--peach-light);
border-radius:8px;
display:flex;
align-items:center;
justify-content:center;
font-size:15px;
}

.form-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:1rem;
margin-bottom:1rem;
}

@media(max-width:600px){
.form-row{
grid-template-columns:1fr;
}
}

.form-group{
margin-bottom:1rem;
}

label{
display:block;
font-size:0.82rem;
font-weight:500;
color:var(--text-sub);
margin-bottom:0.4rem;
}

.badge{
display:inline-block;
background:var(--peach-light);
color:var(--peach-deep);
font-size:0.65rem;
padding:1px 6px;
border-radius:10px;
margin-left:4px;
}

.badge.opt{
background:var(--sage-light);
color:var(--sage-dark);
}

input[type=text],
input[type=number],
textarea{
width:100%;
padding:0.65rem 0.9rem;
border:1.5px solid var(--border);
border-radius:10px;
background:var(--cream);
color:var(--text-main);
font-family:'Noto Sans JP',sans-serif;
font-size:0.9rem;
outline:none;
resize:vertical;
}

input:focus,
textarea:focus{
border-color:var(--peach-mid);
background:white;
}

textarea{
min-height:100px;
line-height:1.6;
}

.hobby-tags{
display:flex;
flex-wrap:wrap;
gap:0.5rem;
margin-top:0.75rem;
}

.hobby-tag{
background:var(--peach-light);
color:var(--peach-deep);
border:1px solid var(--peach);
border-radius:20px;
padding:0.3rem 0.75rem;
font-size:0.8rem;
cursor:pointer;
}

.hobby-tag.active{
background:var(--peach-deep);
color:white;
}

.toggle-group{
display:flex;
gap:0.5rem;
flex-wrap:wrap;
}

.toggle-btn{
padding:0.4rem 1rem;
border:1.5px solid var(--border);
border-radius:20px;
background:var(--cream);
color:var(--text-sub);
font-size:0.82rem;
cursor:pointer;
}

.toggle-btn.active{
background:var(--peach-deep);
color:white;
border-color:var(--peach-deep);
}

.generate-wrap{
text-align:center;
margin:2rem 0;
}

.generate-btn{
background:linear-gradient(135deg,var(--peach-deep),#A0522D);
color:white;
border:none;
border-radius:50px;
padding:1rem 3rem;
font-size:1rem;
font-weight:700;
cursor:pointer;
box-shadow:0 4px 20px rgba(201,107,58,0.35);
}

.loading-wrap{
text-align:center;
padding:3rem 1rem;
display:none;
}

.result-block{
background:var(--warm-white);
border:1px solid var(--border);
border-radius:14px;
overflow:hidden;
margin-bottom:1rem;
box-shadow:0 2px 12px var(--shadow);
opacity:0;
transform:translateY(12px);
transition:0.4s;
}

.result-block.visible{
opacity:1;
transform:translateY(0);
}

.rb-header{
background:var(--peach-light);
padding:0.75rem 1.25rem;
display:flex;
align-items:center;
border-bottom:1px solid var(--peach);
}

.rb-header h3{
font-size:0.9rem;
font-weight:700;
color:var(--peach-deep);
}

.rb-header .cbtn{
margin-left:auto;
background:none;
border:1px solid var(--peach-mid);
color:var(--peach-deep);
border-radius:12px;
padding:0.2rem 0.6rem;
font-size:0.72rem;
cursor:pointer;
}

.rb-body{
padding:1.25rem;
font-size:0.9rem;
line-height:1.85;
white-space:pre-wrap;
}

#error-box{
background:#FFF0F0;
border:1px solid #F4BABA;
border-radius:10px;
padding:1rem;
color:#8B2020;
font-size:0.87rem;
margin-bottom:1rem;
display:none;
line-height:1.6;
}
</style>
</head>

<body>

<header>
<div class="logo-bear">🐻</div>
<div>
<h1>こぐま会話ナビ</h1>
<p>ローカルLLM版（Ollama）</p>
</div>
</header>

<div class="local-banner">
✅ 完全ローカル動作｜APIキー不要｜Ollama接続
</div>

<main>

<div class="section-intro">
<h2>✨ お相手との会話をデザインしよう</h2>
<p>
お相手の情報を入力するだけで、
AIが会話のきっかけ・話題・アドバイスを生成します。
</p>
</div>

<div class="card">

<div class="card-title">
<div class="icon">👤</div>
お相手の基本情報
</div>

<div class="form-row">

<div class="form-group">
<label>お名前</label>
<input type="text" id="partner-name">
</div>

<div class="form-group">
<label>年齢</label>
<input type="number" id="partner-age">
</div>

</div>

<div class="form-row">

<div class="form-group">
<label>職業</label>
<input type="text" id="partner-job">
</div>

<div class="form-group">
<label>居住地</label>
<input type="text" id="partner-place">
</div>

</div>

<div class="form-group">
<label>趣味・好きなこと</label>
<input type="text" id="hobbies-input">
</div>

<div class="form-group">
<label>プロフィール全文</label>
<textarea id="profile-text"></textarea>
</div>

</div>

<div class="generate-wrap">
<button class="generate-btn" id="gen-btn" onclick="generate()">
🌸 会話フローを生成する
</button>
</div>

<div id="error-box"></div>

<div class="loading-wrap" id="loading-wrap">
<p>AIが会話を考えています...</p>
</div>

<div id="result-area"></div>

</main>

<script>

const CFG=[
{t:'🔍 性格・雰囲気分析'},
{t:'💬 鉄板会話ネタ5選'},
{t:'⏱️ 会話の流れ'},
{t:'🆘 救済フレーズ'},
{t:'❓ 質問リスト'},
{t:'⚠️ NGポイント'},
{t:'✨ 好印象アドバイス'}
];

async function generate(){

clearErr();

const name=v('partner-name');
const age=v('partner-age');
const job=v('partner-job');
const place=v('partner-place');
const hobbies=v('hobbies-input');
const profile=v('profile-text');

if(!hobbies && !profile){
err('趣味またはプロフィールを入力してください');
return;
}

setLoad(true);

const prompt=`
あなたは婚活・お見合い専門の会話コーチです。

【お相手情報】
名前：${name}
年齢：${age}
職業：${job}
居住地：${place}
趣味：${hobbies}

プロフィール：
${profile}

以下を丁寧に分析してください。

## 1. 性格・雰囲気分析

## 2. 鉄板会話ネタ5選
最初の一言も含める

## 3. 会話の流れ
序盤、中盤、終盤

## 4. 沈黙時の救済フレーズ

## 5. 盛り上がる質問7選

## 6. NGポイント

## 7. 好印象アドバイス

日本語でやさしく自然に回答してください。
`;

try{

const res=await fetch('http://localhost:11434/api/generate',{

method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({

model:'qwen2.5:32b',

prompt:prompt,

stream:false,

options:{
temperature:0.7,
num_predict:2048
}

})

});

if(!res.ok){
throw new Error('Ollamaへ接続できません');
}

const data=await res.json();

const text=data.response || '';

render(text,name);

}catch(e){

err(`
ローカルLLMエラー

確認してください：

1. Ollama起動
2. qwen2.5:32b導入済み
3. localhost:11434 動作中

エラー：
${e.message}
`);

}finally{

setLoad(false);

}

}

function render(text,name){

const area=document.getElementById('result-area');

area.innerHTML='';

const clean=text.replace(/\*\*/g,'');

const parts=clean.split(/##\s*\d+\.\s*/);

const secs=parts.slice(1);

secs.forEach((s,i)=>{

const cfg=CFG[i] || {t:`セクション${i+1}`};

const lines=s.split('\n');

const body=lines.slice(1).join('\n').trim();

const div=document.createElement('div');

div.className='result-block';

div.innerHTML=`
<div class="rb-header">
<h3>${cfg.t}</h3>
<button class="cbtn" onclick="copyBlock(this)">コピー</button>
</div>
<div class="rb-body">${body}</div>
`;

area.appendChild(div);

});

setTimeout(()=>{
document.querySelectorAll('.result-block')
.forEach((b,i)=>{
setTimeout(()=>b.classList.add('visible'),i*120);
});
},50);

}

function copyBlock(btn){

const body=btn.closest('.result-block').querySelector('.rb-body');

navigator.clipboard.writeText(body.textContent);

btn.textContent='✅';

setTimeout(()=>{
btn.textContent='コピー';
},1500);

}

function setLoad(on){

document.getElementById('loading-wrap').style.display=
on ? 'block' : 'none';

const btn=document.getElementById('gen-btn');

btn.disabled=on;

btn.textContent=
on ? '⏳ 生成中...' : '🌸 会話フローを生成する';

}

function err(msg){

const b=document.getElementById('error-box');

b.style.display='block';

b.textContent=msg;

}

function clearErr(){

document.getElementById('error-box').style.display='none';

}

function v(id){
return document.getElementById(id).value.trim();
}

</script>

</body>
</html>
